<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Sudoku — 1729 Global</title>
<style>
  /* ── Brand palette ──────────────────────────────────────────── */
  :root {
    --navy:   #0c1f3f;
    --navy2:  #172d56;
    --gold:   #c9a256;
    --white:  #ffffff;
    --text:   #2d3748;
    --muted:  #718096;
    --border: #e2e8f0;
    --shadow: 0 2px 14px rgba(0, 0, 0, 0.07);
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
                 "Helvetica Neue", Arial, sans-serif;
    color: var(--text);
    background: var(--white);
    line-height: 1.6;
  }

  /* ── Header ─────────────────────────────────────────────────── */
  header {
    background: var(--navy);
    border-bottom: 3px solid var(--gold);
    padding: 30px 0 26px;
    position: relative;
  }
  .wrap { max-width: 1080px; margin: 0 auto; padding: 0 28px; }
  .brand {
    font-size: 1.6rem;
    font-weight: 700;
    color: var(--white);
    letter-spacing: -0.3px;
  }
  .brand-sub {
    margin-top: 6px;
    font-size: 0.72rem;
    font-weight: 600;
    letter-spacing: 2.5px;
    text-transform: uppercase;
    color: var(--gold);
  }
  .home-link {
    position: absolute;
    top: 14px;
    right: 28px;
    color: var(--white);
    text-decoration: none;
    font-size: 0.82rem;
    font-weight: 600;
    opacity: 0.85;
    border: 1px solid rgba(255, 255, 255, 0.35);
    padding: 5px 12px;
    border-radius: 6px;
    transition: background 0.15s, opacity 0.15s;
  }
  .home-link:hover { background: rgba(255, 255, 255, 0.12); opacity: 1; }

  /* ── Main content ────────────────────────────────────────────── */
  main {
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 34px 16px 48px;
  }
  h1 {
    font-size: 1.6rem;
    color: var(--navy);
    margin-bottom: 4px;
  }
  .subtitle {
    color: var(--muted);
    font-size: 0.9rem;
    margin-bottom: 20px;
    text-align: center;
  }

  /* ── Game card ───────────────────────────────────────────────── */
  /* max-width matches the board's max-width plus the panel's padding */
  .panel {
    background: var(--white);
    border: 1px solid var(--border);
    border-radius: 14px;
    box-shadow: var(--shadow);
    padding: 22px;
    width: 100%;
    max-width: 500px;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  /* ── Difficulty controls ─────────────────────────────────────── */
  #controls {
    width: 100%;
    text-align: center;
    margin-bottom: 14px;
  }
  #controls label {
    font-size: 0.9rem;
    font-weight: 600;
    color: var(--navy);
  }
  #difficulty {
    width: 85%;
    margin: 10px 0 12px;
    accent-color: var(--navy);
    display: block;
    margin-left: auto;
    margin-right: auto;
  }
  .btn-row {
    display: flex;
    gap: 10px;
    justify-content: center;
  }
  .btn {
    border: none;
    background: var(--navy);
    color: var(--white);
    font: inherit;
    font-size: 0.85rem;
    font-weight: 600;
    padding: 8px 18px;
    border-radius: 8px;
    cursor: pointer;
    touch-action: manipulation;
    transition: background 0.15s;
  }
  /* Make Reset and New Game the same width */
  .btn-row .btn { flex: 1 1 0; max-width: 150px; }
  .btn:hover { background: var(--gold); color: var(--navy); }

  /* ── Timer ───────────────────────────────────────────────────── */
  #timer {
    font-size: 0.82rem;
    font-weight: 600;
    color: var(--muted);
    letter-spacing: 0.5px;
    margin-bottom: 12px;
  }

  /* ── Board ───────────────────────────────────────────────────── */
  .board {
    display: grid;
    grid-template-columns: repeat(9, 1fr);
    grid-template-rows: repeat(9, 1fr);
    background: white;
    width: 100%;
    max-width: 450px;
    aspect-ratio: 1;
    border-radius: 6px;
    overflow: hidden;
    margin-bottom: 12px;
  }

  .cell {
    width: 100%;
    height: 100%;
    text-align: center;
    font-size: clamp(14px, 4.5vw, 22px);
    font-family: inherit;
    background: white;
    /* Each cell draws only its TOP and LEFT line, so every internal
       gridline is drawn exactly once — no doubled/"broken" lines beside
       the navy box dividers. The outer frame comes from the box-divider
       classes on the edge cells (rows/cols 0 and 8). */
    border: none;
    border-top: 1px solid #ccd3e3;
    border-left: 1px solid #ccd3e3;
    box-sizing: border-box;
    outline: none;
    padding: 0;
    margin: 0;
    border-radius: 0;
    -webkit-appearance: none;
    color: var(--navy);
  }

  /* Thick navy dividers between the 3×3 boxes and around the outer edge */
  .cell.border-top    { border-top: 2px solid var(--navy); }
  .cell.border-left   { border-left: 2px solid var(--navy); }
  .cell.border-right  { border-right: 2px solid var(--navy); }
  .cell.border-bottom { border-bottom: 2px solid var(--navy); }

  .cell.fixed   { background: #e8ecf3; font-weight: 700; color: var(--navy); }
  .cell.invalid { color: #c0392b; background: #ffe6e6; }
  .highlighted  { background: #f2e6c4 !important; }   /* light gold row/col */

  /* iOS Safari dims disabled inputs by default; force the same look as
     desktop so preset cells aren't darker on mobile. */
  .cell:disabled {
    opacity: 1;
    -webkit-text-fill-color: var(--navy);
  }

  /* ── Win message ─────────────────────────────────────────────── */
  #message {
    font-weight: 700;
    font-size: 1.1rem;
    color: var(--navy);
    min-height: 1.5em;
    text-align: center;
    margin-bottom: 4px;
  }

  /* ── Weekly presets section ──────────────────────────────────── */
  /* Replaces the dated <fieldset> with a clean styled <div> */
  .preset-box {
    width: 100%;
    margin-top: 16px;
    border-top: 1px solid var(--border);
    padding-top: 14px;
  }
  .preset-title {
    font-size: 0.8rem;
    font-weight: 700;
    letter-spacing: 1px;
    text-transform: uppercase;
    color: var(--muted);
    text-align: center;
    margin-bottom: 10px;
  }
  .preset-section {
    display: flex;
    gap: 10px;
    justify-content: space-around;
    flex-wrap: wrap;
  }
  .preset-group {
    flex: 1;
    min-width: 80px;
    text-align: center;
  }
  .preset-group strong {
    font-size: 0.82rem;
    color: var(--navy);
  }
  select {
    width: 100%;
    margin-top: 5px;
    padding: 6px 8px;
    font-size: 0.85rem;
    font-family: inherit;
    border: 1px solid var(--border);
    border-radius: 6px;
    background: var(--white);
    color: var(--text);
    cursor: pointer;
  }
  select:focus { outline: 2px solid var(--navy); outline-offset: 1px; }

  @media (max-width: 580px) {
    .wrap { padding: 0 16px; }
    .home-link { right: 16px; }
    main { padding: 22px 8px 36px; }
    .panel { padding: 14px; }
  }
</style>
</head>
<body>

<header>
  <div class="wrap">
    <div class="brand">1729 Global</div>
    <div class="brand-sub">An Investment &amp; Advisory Firm</div>
    <a class="home-link" href="../index.html">&#8592; Home</a>
  </div>
</header>

<main>
  <h1>Sudoku</h1>
  <p class="subtitle">Fill the grid so every row, column, and 3×3 box contains each digit 1–9 exactly once.</p>

  <div class="panel">

    <div id="controls">
      <label for="difficulty">Difficulty: <span id="difficultyLabel">Easy</span></label>
      <input type="range" id="difficulty" min="1" max="100" value="30" />
      <div class="btn-row">
        <button class="btn" onclick="resetBoard()">Reset</button>
        <button class="btn" onclick="newGame()">New Game</button>
      </div>
    </div>

    <div id="timer">Time: 00:00</div>

    <div class="board" id="sudokuBoard"></div>

    <div id="message"></div>

    <div class="preset-box">
      <div class="preset-title">Weekly Presets</div>
      <div class="preset-section">
        <div class="preset-group">
          <strong>Easy</strong><br />
          <select id="easyPreset" onchange="selectPreset('easy', this)">
            <option value="">--</option>
          </select>
        </div>
        <div class="preset-group">
          <strong>Medium</strong><br />
          <select id="mediumPreset" onchange="selectPreset('medium', this)">
            <option value="">--</option>
          </select>
        </div>
        <div class="preset-group">
          <strong>Hard</strong><br />
          <select id="hardPreset" onchange="selectPreset('hard', this)">
            <option value="">--</option>
          </select>
        </div>
      </div>
    </div>

  </div><!-- /.panel -->
</main>

<script src="presets.js"></script>

<script>
const boardEl = document.getElementById('sudokuBoard');
const timerEl = document.getElementById('timer');
const messageEl = document.getElementById('message');
const difficultySlider = document.getElementById('difficulty');
const difficultyLabel = document.getElementById('difficultyLabel');

let timerInterval, seconds = 0;
let solution = [];
let userBoard = [];
let originalPuzzle = [];

const easySelect = document.getElementById('easyPreset');
const mediumSelect = document.getElementById('mediumPreset');
const hardSelect = document.getElementById('hardPreset');

function pad(n) { return n < 10 ? '0'+n : n; }

function startTimer() {
  clearInterval(timerInterval);
  seconds = 0;
  timerEl.textContent = "Time: 00:00";
  timerInterval = setInterval(() => {
    seconds++;
    timerEl.textContent = `Time: ${pad(Math.floor(seconds/60))}:${pad(seconds%60)}`;
  }, 1000);
}
function stopTimer() { clearInterval(timerInterval); }

function getDifficultyLevel() {
   const val = parseInt(difficultySlider.value);
   if (val <= 10)        return "Very Very Easy";
   else if (val <= 20)   return "Very Easy";
   else if (val <= 30)   return "Easy";
   else if (val <= 40)   return "Easy-Medium";
   else if (val <= 50)   return "Medium";
   else if (val <= 60)   return "Medium+";
   else if (val <= 70)   return "Medium-Hard";
   else if (val <= 80)   return "Hard";
   else if (val <= 90)   return "Very Hard";
   else                  return "Genius";
 }

difficultySlider.addEventListener('input', () => {
  const level = getDifficultyLevel();
  difficultyLabel.textContent = level.charAt(0).toUpperCase() + level.slice(1);
});

// ==========================================
// ADVANCED GENERATOR (Client-Side)
// ==========================================

// 1. Solver to check for uniqueness
function countSolutions(board) {
  let solutions = 0;

  function solve(grid) {
    if (solutions > 1) return; // Stop early if not unique

    // --- OPTIMIZATION: Minimum Remaining Values (MRV) ---
    // Instead of taking the first empty cell, find the one with fewest valid moves.
    let bestRow = -1;
    let bestCol = -1;
    let minOptions = 10; // Start higher than max possible (9)

    for (let r = 0; r < 9; r++) {
      for (let c = 0; c < 9; c++) {
        if (grid[r][c] === null) {
          // Count how many numbers are valid for this cell
          let optionsCount = 0;
          for (let num = 1; num <= 9; num++) {
            if (isSafe(grid, r, c, num)) optionsCount++;
          }

          // If we found a cell with 0 options, this path is dead. Backtrack immediately.
          if (optionsCount === 0) return;

          // If this cell has fewer options than our current best, pick it.
          if (optionsCount < minOptions) {
            minOptions = optionsCount;
            bestRow = r;
            bestCol = c;
            // Optimization: If it only has 1 option, pick it immediately!
            if (minOptions === 1) break;
          }
        }
      }
      if (minOptions === 1) break; // Break outer loop too
    }

    // If minOptions is still 10, it means no empty cells were found. Puzzle solved.
    if (bestRow === -1) {
      solutions++;
      return;
    }
    // -----------------------------------------------------

    // Try numbers for the Best Cell we found
    for (let num = 1; num <= 9; num++) {
      if (isSafe(grid, bestRow, bestCol, num)) {
        grid[bestRow][bestCol] = num;
        solve(grid);
        grid[bestRow][bestCol] = null; // Backtrack
      }
    }
  }

  // Create deep copy to protect the board state
  let gridCopy = JSON.parse(JSON.stringify(board));
  solve(gridCopy);
  return solutions;
}

// 2. Standard Safe Check
function isSafe(board, row, col, num) {
  // Row & Col Check
  for (let x = 0; x < 9; x++) {
    if (board[row][x] === num || board[x][col] === num) return false;
  }
  // 3x3 Box Check
  let startRow = row - row % 3;
  let startCol = col - col % 3;
  for (let i = 0; i < 3; i++) {
    for (let j = 0; j < 3; j++) {
      if (board[i + startRow][j + startCol] === num) return false;
    }
  }
  return true;
}

// 3. Generate a solved board (Seed)
function generateFullBoard() {
  const board = Array.from({ length: 9 }, () => Array(9).fill(null));

  function fill(r = 0, c = 0) {
    if (r === 9) return true;
    const [nextR, nextC] = c === 8 ? [r + 1, 0] : [r, c + 1];

    // Shuffle 1-9 for randomness
    let nums = [1, 2, 3, 4, 5, 6, 7, 8, 9].sort(() => Math.random() - 0.5);

    for (let n of nums) {
      if (isSafe(board, r, c, n)) {
        board[r][c] = n;
        if (fill(nextR, nextC)) return true;
        board[r][c] = null;
      }
    }
    return false;
  }

  fill();
  return board;
}

// 4. Dig holes while maintaining ONE unique solution
function makePuzzle(fullBoard, attempts) {
  let puzzle = JSON.parse(JSON.stringify(fullBoard));

  // Create a list of all cell positions and shuffle them
  let positions = [];
  for(let r=0; r<9; r++){
    for(let c=0; c<9; c++){
      positions.push([r,c]);
    }
  }
  positions.sort(() => Math.random() - 0.5);

  // Try to remove numbers
  for (let [r, c] of positions) {
    if (attempts <= 0) break;

    let backup = puzzle[r][c]; // Remember the number
    puzzle[r][c] = null;       // Remove it

    // Check if the board still has EXACTLY 1 solution
    // Note: We pass the 'puzzle' with the nulls to the solver
    let solutions = countSolutions(puzzle);

    if (solutions !== 1) {
      puzzle[r][c] = backup; // Put it back, removing this broke uniqueness
    } else {
      attempts--; // Successfully removed one
    }
  }

  return puzzle;
}
// ==========================================


function populatePresetDropdowns() {
  // We check if 'presets' exists (loaded from external file)
  if (typeof presets === 'undefined') {
    console.error("presets.js not loaded!");
    return;
  }

  function fill(sel) {
    sel.innerHTML = '<option value="">--</option>';
    for (let i = 0; i < 10; i++) {
      let opt = document.createElement('option');
      opt.value = i;
      opt.textContent = "Game " + (i+1);
      sel.appendChild(opt);
    }
  }
  fill(easySelect);
  fill(mediumSelect);
  fill(hardSelect);
}

function selectPreset(level, selElem) {
  const idx = selElem.value;
  if (idx === "") return;

  if (presets[level] && presets[level][idx]) {
    const { puzzle, solution: sol } = presets[level][idx];
    solution = JSON.parse(JSON.stringify(sol));
    originalPuzzle = JSON.parse(JSON.stringify(puzzle));
    renderBoard(originalPuzzle);
    startTimer();
    messageEl.textContent = '';
    selElem.value = "";
  }
}

function renderBoard(puzzle) {
  boardEl.innerHTML = '';
  userBoard = JSON.parse(JSON.stringify(puzzle));
  for(let r=0;r<9;r++){
    for(let c=0;c<9;c++){
      const cell = document.createElement('input');

      // Mobile Keyboard Optimization
      cell.setAttribute('type', 'tel');
      cell.setAttribute('inputmode', 'numeric');
      cell.setAttribute('pattern', '[0-9]*');

      cell.maxLength = 1;
      cell.classList.add('cell');
      cell.dataset.row = r;
      cell.dataset.col = c;

      if(r%3===0) cell.classList.add('border-top');
      if(c%3===0) cell.classList.add('border-left');
      if(r===8) cell.classList.add('border-bottom');
      if(c===8) cell.classList.add('border-right');

      cell.addEventListener('focus', (e) => {
        e.target.select();
        highlightRowCol(r,c);
      });

      if(puzzle[r][c] !== null){
        cell.value = puzzle[r][c];
        cell.disabled = true;
        cell.classList.add('fixed');
      } else {
        cell.addEventListener('input', () => {
          let val = parseInt(cell.value);
          if(isNaN(val)||val<1||val>9){
            cell.value=''; userBoard[r][c]=null;
            cell.classList.remove('invalid');
            return;
          }
          userBoard[r][c] = val;
          // Check correctness immediately if solution exists
          if(solution && solution.length) {
             cell.classList.toggle('invalid', val !== solution[r][c]);
             checkWin();
          }
        });
      }
      boardEl.appendChild(cell);
    }
  }
}

function highlightRowCol(row,col) {
  document.querySelectorAll('.cell').forEach(c=>c.classList.remove('highlighted'));
  document.querySelectorAll(`.cell[data-row="${row}"]`).forEach(c=>c.classList.add('highlighted'));
  document.querySelectorAll(`.cell[data-col="${col}"]`).forEach(c=>c.classList.add('highlighted'));
}

function resetBoard(){
  if(originalPuzzle.length === 0) return;
  renderBoard(originalPuzzle);
  messageEl.textContent = '';
  startTimer();
}

function newGame(){
  const val = parseInt(difficultySlider.value);
  let emptyCount;
  if (val <= 10)        emptyCount = 25; // Very Very Easy
  else if (val <= 20)   emptyCount = 30; // Very Easy
  else if (val <= 30)   emptyCount = 35; // Easy
  else if (val <= 40)   emptyCount = 40; // Easy-Medium
  else if (val <= 50)   emptyCount = 45; // Medium
  else if (val <= 60)   emptyCount = 48; // Medium+
  else if (val <= 70)   emptyCount = 50; // Medium-Hard
  else if (val <= 80)   emptyCount = 54; // Hard
  else if (val <= 90)   emptyCount = 56; // Very Hard
  else                  emptyCount = 58; // Genius

  const full = generateFullBoard();
  solution = JSON.parse(JSON.stringify(full));
  const puzzle = makePuzzle(full, emptyCount);
  originalPuzzle = JSON.parse(JSON.stringify(puzzle));
  renderBoard(puzzle);
  messageEl.textContent='';
  startTimer();
}

function checkWin(){
  for(let r=0;r<9;r++){
    for(let c=0;c<9;c++){
      if(userBoard[r][c] !== solution[r][c]) return;
    }
  }
  stopTimer();
  messageEl.textContent = '🎉 You Win!';
}

// Arrow keys: jump to the next EDITABLE (non-preset) cell in that direction.
boardEl.addEventListener('keydown', (e) => {
  const active = document.activeElement;
  if (!active || !active.classList.contains('cell')) return;

  let dr = 0, dc = 0;
  if (e.key === 'ArrowRight')      dc = 1;
  else if (e.key === 'ArrowLeft')  dc = -1;
  else if (e.key === 'ArrowUp')    dr = -1;
  else if (e.key === 'ArrowDown')  dr = 1;
  else return;

  e.preventDefault();   // don't move the text caret / scroll the page
  let r = +active.dataset.row + dr;
  let c = +active.dataset.col + dc;
  while (r >= 0 && r < 9 && c >= 0 && c < 9) {
    const next = boardEl.querySelector(`.cell[data-row="${r}"][data-col="${c}"]`);
    if (next && !next.disabled) { next.focus(); return; }
    r += dr; c += dc;   // skip over preset (disabled) cells
  }
});

// Start
populatePresetDropdowns();
newGame();

</script>
</body>
</html>
