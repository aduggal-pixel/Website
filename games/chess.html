<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Chess — 1729 Global</title>
<style>
  /* ── Brand palette ──────────────────────────────────────────── */
  :root {
    --navy:   #0c1f3f;
    --navy2:  #172d56;
    --gold:   #c9a256;
    --white:  #ffffff;
    --text:   #2d3748;
    --muted:  #718096;
    --border: #e2e8f0;
    --shadow: 0 2px 14px rgba(0, 0, 0, 0.07);
    /* Square size scales with the screen: small on phones, capped on desktop */
    --sq: clamp(34px, 11vw, 60px);
    --board-green: #769656;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
                 "Helvetica Neue", Arial, sans-serif;
    color: var(--text);
    background: var(--white);
    line-height: 1.6;
  }

  /* ── Header ─────────────────────────────────────────────────── */
  header {
    background: var(--navy);
    border-bottom: 3px solid var(--gold);
    padding: 30px 0 26px;
    position: relative;
  }
  .wrap { max-width: 1080px; margin: 0 auto; padding: 0 28px; }
  .brand {
    font-size: 1.6rem;
    font-weight: 700;
    color: var(--white);
    letter-spacing: -0.3px;
  }
  .brand-sub {
    margin-top: 6px;
    font-size: 0.72rem;
    font-weight: 600;
    letter-spacing: 2.5px;
    text-transform: uppercase;
    color: var(--gold);
  }
  .home-link {
    position: absolute;
    top: 14px;
    right: 28px;
    color: var(--white);
    text-decoration: none;
    font-size: 0.82rem;
    font-weight: 600;
    opacity: 0.85;
    border: 1px solid rgba(255, 255, 255, 0.35);
    padding: 5px 12px;
    border-radius: 6px;
    transition: background 0.15s, opacity 0.15s;
  }
  .home-link:hover { background: rgba(255, 255, 255, 0.12); opacity: 1; }

  /* ── Main content ───────────────────────────────────────────── */
  main {
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 34px 16px 48px;
  }
  h1 {
    font-size: 1.6rem;
    color: var(--navy);
    margin-bottom: 4px;
  }
  .subtitle {
    color: var(--muted);
    font-size: 0.9rem;
    margin-bottom: 18px;
    text-align: center;
  }

  #status {
    font-weight: 700;
    font-size: 1.1rem;
    margin-bottom: 18px;
    min-height: 1.4em;
    text-align: center;
    color: var(--navy);
  }

  /* ── Game card ──────────────────────────────────────────────── */
  .panel {
    background: var(--white);
    border: 1px solid var(--border);
    border-radius: 14px;
    box-shadow: var(--shadow);
    padding: 24px;
  }

  /* Board on the left, sidebar on the right, grouped and centred. */
  .container {
    display: flex;
    justify-content: center;
    align-items: flex-start;
    gap: 24px;
  }
  .sidebar-col { flex: none; }

  .board-area { display: flex; flex-direction: column; align-items: center; }

  /* The rows just above and below the board: captured pieces on the left,
     a small clock on the right. */
  .board-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    width: calc(var(--sq) * 8);
    gap: 8px;
    margin: 4px 0;
  }
  .captured {
    flex: 1;
    min-height: 30px;
    font-size: 24px;
    line-height: 30px;
    letter-spacing: 2px;
    color: #333;
    white-space: normal;       /* allow captured pieces to wrap to a 2nd line */
    overflow: visible;
  }

  /* The board itself is an 8x8 CSS grid */
  .board {
    display: grid;
    grid-template-columns: repeat(8, var(--sq));
    grid-template-rows: repeat(8, var(--sq));
    border: 3px solid #444;
    --light: #eeeed2;
    --dark: var(--board-green);
  }
  .square {
    width: var(--sq);
    height: var(--sq);
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    cursor: pointer;
    user-select: none;
  }
  .square.light { background: var(--light); }
  .square.dark  { background: var(--dark); }

  .piece {
    font-size: calc(var(--sq) * 0.72);
    line-height: 1;
  }

  /* Highlights */
  .square.selected  { box-shadow: inset 0 0 0 4px #f6e05e; }
  .square.last-move { background: #cdd26a; }
  .square.last-move.dark { background: #aaa23b; }

  /* A small dot marking a legal destination */
  .square.target::after {
    content: "";
    position: absolute;
    width: 28%;
    height: 28%;
    border-radius: 50%;
    background: rgba(0, 0, 0, 0.3);
  }
  /* If the target square holds an enemy piece, show a ring instead of a dot */
  .square.target:has(.piece)::after {
    width: 88%;
    height: 88%;
    background: transparent;
    border: 5px solid rgba(0, 0, 0, 0.3);
    box-sizing: border-box;
  }

  .sidebar {
    display: flex;
    flex-direction: column;
    gap: 8px;
    width: 160px;             /* narrower, more compact moves panel */
    /* match the board: align the first button with the board's top edge
       (the captured/clock row above the board is 38px tall) and stretch the
       column down so the moves box bottom meets the board's bottom edge */
    margin-top: 38px;
    height: calc(var(--sq) * 8);
  }
  .sidebar button { width: 100%; }            /* stacked, equal-size buttons */

  /* Clock control: a segmented group of small buttons in a navy-bordered box */
  .clock-control {
    border: 1px solid var(--navy);
    border-radius: 8px;
    padding: 8px;
  }
  .clock-label {
    font-size: 0.7rem;
    font-weight: 700;
    letter-spacing: 1px;
    text-transform: uppercase;
    color: var(--navy);
    margin-bottom: 7px;
  }
  .clock-options {
    display: flex;
    flex-wrap: wrap;
    gap: 5px;
  }
  /* Override the full-width sidebar-button rule so these sit side by side */
  .sidebar .clock-opt {
    width: auto;
    flex: 1 1 auto;
    min-width: 34px;
    padding: 6px 0;
    font-size: 0.82rem;
    font-weight: 600;
    border-radius: 6px;
  }
  .sidebar .clock-opt:hover { background: var(--navy2); color: #fff; }
  .clock-opt.active { background: var(--gold); color: var(--navy); }
  .clock-opt.active:hover { background: var(--gold); color: var(--navy); }

  /* Small clocks tucked beside the board */
  .clock {
    font-size: 1rem;
    font-variant-numeric: tabular-nums;
    padding: 3px 8px;
    background: #fff;
    border: 1px solid #ccc;
    border-radius: 6px;
    min-width: 56px;
    text-align: center;
  }
  .clock.active { background: #f7eccb; border-color: var(--gold); font-weight: bold; }

  /* Navy buttons with gold hover, matching the rest of the site */
  button {
    padding: 8px 10px;
    font-size: 0.9rem;
    cursor: pointer;
    border: none;
    border-radius: 6px;
    background: var(--navy);
    color: #fff;
    font-weight: 600;
    transition: background 0.15s, color 0.15s;
  }
  button:hover { background: var(--gold); color: var(--navy); }

  select {
    padding: 6px 8px;
    font-size: 0.9rem;
    cursor: pointer;
    border: 1px solid var(--border);
    border-radius: 6px;
    background: #fff;
  }
  label { font-size: 0.9rem; color: var(--muted); }

  #history {
    background: #f7f8fa;
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 8px;
    flex: 1;                  /* grow to fill, so its bottom meets the board's */
    min-height: 0;
    overflow-y: auto;
    font-size: 0.9rem;
    line-height: 1.6;
  }
  #history .movenum { color: var(--gold); display: inline-block; width: 24px; }

  /* Pawn-promotion chooser overlay */
  #promotion {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.5);
    align-items: center;
    justify-content: center;
  }
  #promotion .choices {
    background: #fff;
    padding: 16px;
    border-radius: 10px;
    display: flex;
    gap: 8px;
  }
  /* Neutral promotion buttons so the piece symbols show in their true colour */
  #promotion button {
    font-size: 2.4rem;
    padding: 6px 10px;
    background: #fff;
    color: #000;
    border: 1px solid #ccc;
  }
  #promotion button:hover { background: #eee; }

  /* On narrow screens (phones/tablets) stack the sidebar below the board */
  @media (max-width: 700px) {
    .wrap { padding: 0 16px; }
    .home-link { right: 16px; }
    main { padding: 22px 8px 36px; }
    .panel { padding: 16px; }
    .container {
      flex-direction: column;
      align-items: center;
    }
    .sidebar { width: calc(var(--sq) * 8); margin-top: 12px; height: auto; }
    .sidebar #history { height: 180px; flex: none; }
  }
</style>
</head>
<body>

<header>
  <div class="wrap">
    <div class="brand">1729 Global</div>
    <div class="brand-sub">An Investment &amp; Advisory Firm</div>
    <a class="home-link" href="../index.html">&#8592; Home</a>
  </div>
</header>

<main>
  <h1>Chess</h1>
  <p class="subtitle">Two-player chess with legal moves, captures, a clock, and move history.</p>
  <div id="status">White to move</div>

  <div class="panel">
  <div class="container">
    <div></div> <!-- left spacer: keeps the board centred on the screen -->

    <div class="board-area">
      <div class="board-row">
        <div class="captured" id="capturedTop"></div>
        <div class="clock" id="clockTop">—</div>
      </div>
      <div class="board" id="board"></div>
      <div class="board-row">
        <div class="captured" id="capturedBottom"></div>
        <div class="clock" id="clockBottom">—</div>
      </div>
    </div>

    <div class="sidebar-col">
      <div class="sidebar">
        <button onclick="newGame()">New Game</button>
        <button onclick="undo()">Undo</button>
        <button onclick="flip()">Flip</button>
        <div class="clock-control">
          <div class="clock-label">Clock</div>
          <div class="clock-options" id="clockOptions">
            <button type="button" class="clock-opt active" data-min="0">Off</button>
            <button type="button" class="clock-opt" data-min="5">5</button>
            <button type="button" class="clock-opt" data-min="10">10</button>
            <button type="button" class="clock-opt" data-min="15">15</button>
            <button type="button" class="clock-opt" data-min="30">30</button>
            <button type="button" class="clock-opt" data-min="60">60</button>
          </div>
        </div>
        <div id="history"></div>
      </div>
    </div>
  </div>
  </div>
</main>

  <!-- Pawn promotion chooser, hidden until needed -->
  <div id="promotion">
    <div class="choices">
      <button data-type="q" onclick="choosePromotion('q')"></button>
      <button data-type="r" onclick="choosePromotion('r')"></button>
      <button data-type="b" onclick="choosePromotion('b')"></button>
      <button data-type="n" onclick="choosePromotion('n')"></button>
    </div>
  </div>

  <!-- chess.js: the library that knows all the rules of chess for us -->
  <script src="https://cdn.jsdelivr.net/npm/chess.js@0.10.3/chess.js"></script>
  <script>
    // ----- Game state -------------------------------------------------------
    // `game` is the "brain": it tracks the position and enforces the rules.
    let game = new Chess();

    let orientation = "white";   // which colour sits at the bottom
    let selectedSquare = null;   // the square the player has clicked, e.g. "e2"
    let legalTargets = [];       // squares the selected piece may move to
    let lastMove = null;         // {from, to} of the most recent move (for highlight)
    let gameOver = false;

    // Captured pieces. capturedByWhite = black pieces White has taken, etc.
    let capturedByWhite = [];
    let capturedByBlack = [];

    // Clock state
    let timeControl = 0;             // minutes per side; 0 means no clock
    let times = { w: 0, b: 0 };      // seconds remaining
    let ticker = null;               // the running setInterval, if any

    let pendingPromotion = null;     // holds a move while we ask which piece

    const boardEl = document.getElementById("board");

    // Map each piece (colour + type) to its Unicode chess symbol.
    // The trailing ︎ is a "text presentation selector": it forces these
    // glyphs to render as plain text, stopping iOS from showing the black pawn
    // (♟) as a larger, mismatched emoji.
    const VS = "︎";
    const PIECES = {
      w: { k: "♔"+VS, q: "♕"+VS, r: "♖"+VS, b: "♗"+VS, n: "♘"+VS, p: "♙"+VS },
      b: { k: "♚"+VS, q: "♛"+VS, r: "♜"+VS, b: "♝"+VS, n: "♞"+VS, p: "♟"+VS },
    };

    const FILES = ["a", "b", "c", "d", "e", "f", "g", "h"];

    // ----- Rendering --------------------------------------------------------
    // render() rebuilds the visible board from the current game state.
    function render() {
      boardEl.innerHTML = "";

      // Decide the order of ranks/files based on which way the board faces.
      const ranks = orientation === "white" ? [8, 7, 6, 5, 4, 3, 2, 1] : [1, 2, 3, 4, 5, 6, 7, 8];
      const files = orientation === "white" ? FILES : [...FILES].reverse();

      for (const rank of ranks) {
        for (let f = 0; f < files.length; f++) {
          const file = files[f];
          const square = file + rank;
          const fileIndex = FILES.indexOf(file);

          const el = document.createElement("div");
          // a1 is a dark square; light when (file index + rank) is even.
          const isLight = (fileIndex + rank) % 2 === 0;
          el.className = "square " + (isLight ? "light" : "dark");
          el.dataset.square = square;

          if (lastMove && (square === lastMove.from || square === lastMove.to)) {
            el.classList.add("last-move");
          }
          if (square === selectedSquare) el.classList.add("selected");
          if (legalTargets.includes(square)) el.classList.add("target");

          const piece = game.get(square);
          if (piece) {
            const span = document.createElement("span");
            span.className = "piece";
            span.textContent = PIECES[piece.color][piece.type];
            span.draggable = true;
            el.appendChild(span);
          }
          boardEl.appendChild(el);
        }
      }
    }

    // The side at the bottom of the board depends on orientation, so the clock
    // and captured pieces for each colour follow the board when it is flipped.
    function topColor()    { return orientation === "white" ? "b" : "w"; }
    function bottomColor() { return orientation === "white" ? "w" : "b"; }

    // Pieces captured BY a colour are that colour's opponent's pieces.
    function capturedBy(color) {
      const taken = color === "w" ? capturedByWhite : capturedByBlack;
      const oppColour = color === "w" ? "b" : "w";
      return taken.map((t) => PIECES[oppColour][t]).join("");
    }

    function renderCaptured() {
      document.getElementById("capturedTop").textContent = capturedBy(topColor());
      document.getElementById("capturedBottom").textContent = capturedBy(bottomColor());
    }

    function renderHistory() {
      const h = game.history();
      let html = "";
      for (let i = 0; i < h.length; i += 2) {
        const num = i / 2 + 1;
        const white = h[i] || "";
        const black = h[i + 1] || "";
        html += `<div><span class="movenum">${num}.</span> ${white} ${black}</div>`;
      }
      const el = document.getElementById("history");
      el.innerHTML = html;
      el.scrollTop = el.scrollHeight;
    }

    function fmt(seconds) {
      const m = Math.floor(seconds / 60);
      const s = String(seconds % 60).padStart(2, "0");
      return `${m}:${s}`;
    }

    function renderClocks() {
      const show = timeControl > 0;          // hide the boxes entirely if no clock
      setClock(document.getElementById("clockTop"), topColor(), show);
      setClock(document.getElementById("clockBottom"), bottomColor(), show);
    }

    function setClock(el, color, show) {
      el.style.display = show ? "" : "none";
      el.textContent = show ? fmt(times[color]) : "—";
      el.classList.toggle("active", !gameOver && show && game.turn() === color);
    }

    // updateInfo() refreshes everything that isn't the board grid itself,
    // and works out the current status message (check / checkmate / etc.).
    function updateInfo() {
      renderCaptured();
      renderHistory();
      renderClocks();

      let status;
      const mover = game.turn() === "w" ? "White" : "Black";
      const other = game.turn() === "w" ? "Black" : "White";

      if (game.in_checkmate()) {
        status = `Checkmate — ${other} wins!`;
        endGame();
      } else if (game.in_stalemate()) {
        status = "Stalemate — draw.";
        endGame();
      } else if (game.in_threefold_repetition()) {
        status = "Draw by threefold repetition.";
        endGame();
      } else if (game.insufficient_material()) {
        status = "Draw — insufficient material.";
        endGame();
      } else if (game.in_draw()) {
        status = "Draw.";
        endGame();
      } else if (game.in_check()) {
        status = `${mover} to move — Check!`;
      } else {
        status = `${mover} to move`;
      }
      document.getElementById("status").textContent = status;
    }

    // ----- Making moves -----------------------------------------------------
    function selectSquare(square) {
      selectedSquare = square;
      // Ask the library for every legal move from this square.
      legalTargets = game.moves({ square: square, verbose: true }).map((m) => m.to);
      render();
    }

    function clearSelection() {
      selectedSquare = null;
      legalTargets = [];
    }

    function onSquareClick(square) {
      if (gameOver) return;
      const piece = game.get(square);

      if (selectedSquare) {
        if (legalTargets.includes(square)) {
          tryMove(selectedSquare, square);
          return;
        }
        // Clicked somewhere that isn't a legal target:
        if (piece && piece.color === game.turn()) {
          selectSquare(square);          // switch selection to that piece
        } else {
          clearSelection();
          render();
        }
      } else if (piece && piece.color === game.turn()) {
        selectSquare(square);
      }
    }

    // tryMove checks whether the move needs a promotion choice first.
    function tryMove(from, to) {
      const candidate = game
        .moves({ square: from, verbose: true })
        .find((m) => m.to === to);
      if (!candidate) return;

      if (candidate.flags.includes("p")) {
        // It's a pawn reaching the last rank — ask which piece to become.
        pendingPromotion = { from, to };
        showPromotion(game.turn());
        return;
      }
      doMove({ from, to });
    }

    function doMove(move) {
      const result = game.move({
        from: move.from,
        to: move.to,
        promotion: move.promotion || "q",
      });
      if (!result) return; // illegal; ignore

      // Record a capture, if any, into the right tray.
      if (result.captured) {
        if (result.color === "w") capturedByWhite.push(result.captured);
        else capturedByBlack.push(result.captured);
      }

      lastMove = { from: result.from, to: result.to };
      clearSelection();
      ensureTicker(); // start the clock on the first move
      render();
      updateInfo();
    }

    // ----- Promotion chooser ------------------------------------------------
    function showPromotion(color) {
      const modal = document.getElementById("promotion");
      modal.querySelectorAll("button").forEach((btn) => {
        btn.textContent = PIECES[color][btn.dataset.type];
      });
      modal.style.display = "flex";
    }

    function choosePromotion(type) {
      document.getElementById("promotion").style.display = "none";
      if (pendingPromotion) {
        doMove({ from: pendingPromotion.from, to: pendingPromotion.to, promotion: type });
        pendingPromotion = null;
      }
    }

    // ----- Buttons ----------------------------------------------------------
    function undo() {
      const undone = game.undo();
      if (!undone) return;
      if (undone.captured) {
        if (undone.color === "w") capturedByWhite.pop();
        else capturedByBlack.pop();
      }
      const hist = game.history({ verbose: true });
      lastMove = hist.length
        ? { from: hist[hist.length - 1].from, to: hist[hist.length - 1].to }
        : null;
      gameOver = false;
      clearSelection();
      render();
      updateInfo();
    }

    function flip() {
      orientation = orientation === "white" ? "black" : "white";
      render();
      renderClocks();
      renderCaptured();
    }

    function newGame() {
      game = new Chess();
      selectedSquare = null;
      legalTargets = [];
      lastMove = null;
      capturedByWhite = [];
      capturedByBlack = [];
      gameOver = false;
      stopTicker();
      times = { w: timeControl * 60, b: timeControl * 60 };
      render();
      updateInfo();
    }

    // ----- Clock ------------------------------------------------------------
    function setTimeControl(minutes) {
      timeControl = parseInt(minutes, 10);
      stopTicker();
      times = { w: timeControl * 60, b: timeControl * 60 };
      renderClocks();
    }

    function ensureTicker() {
      if (timeControl === 0 || ticker || gameOver) return;
      ticker = setInterval(() => {
        if (gameOver) return;
        const t = game.turn();
        times[t] -= 1;
        if (times[t] <= 0) {
          times[t] = 0;
          renderClocks();
          document.getElementById("status").textContent =
            `${t === "w" ? "White" : "Black"} ran out of time.`;
          endGame();
          return;
        }
        renderClocks();
      }, 1000);
    }

    function stopTicker() {
      if (ticker) {
        clearInterval(ticker);
        ticker = null;
      }
    }

    function endGame() {
      gameOver = true;
      stopTicker();
    }

    // ----- Wiring up input (events) ----------------------------------------
    boardEl.addEventListener("click", (e) => {
      const sq = e.target.closest(".square");
      if (sq) onSquareClick(sq.dataset.square);
    });

    boardEl.addEventListener("dragstart", (e) => {
      const sq = e.target.closest(".square");
      if (!sq) return;
      const square = sq.dataset.square;
      const piece = game.get(square);
      if (gameOver || !piece || piece.color !== game.turn()) {
        e.preventDefault();
        return;
      }
      selectSquare(square);
      e.dataTransfer.setData("text/plain", square);
    });

    boardEl.addEventListener("dragover", (e) => e.preventDefault());

    boardEl.addEventListener("drop", (e) => {
      e.preventDefault();
      const sq = e.target.closest(".square");
      if (!sq) return;
      const from = e.dataTransfer.getData("text/plain");
      const to = sq.dataset.square;
      if (legalTargets.includes(to)) tryMove(from, to);
      else {
        clearSelection();
        render();
      }
    });

    // Clock control: clicking a time option highlights it and sets the clock.
    document.getElementById("clockOptions").addEventListener("click", (e) => {
      const btn = e.target.closest(".clock-opt");
      if (!btn) return;
      document
        .querySelectorAll("#clockOptions .clock-opt")
        .forEach((b) => b.classList.remove("active"));
      btn.classList.add("active");
      setTimeControl(btn.dataset.min);
    });

    // ----- Start ------------------------------------------------------------
    render();
    updateInfo();
  </script>
</body>
</html>
