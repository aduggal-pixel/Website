<title>Sudoku Game — Mobile Optimized</title>
<style>
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: #f0f0f0;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 10px; /* Reduced padding for mobile */
    min-height: 100vh;
  }
  h1 { margin: 10px 0; font-size: 1.5rem; }
  
  #controls { 
    text-align: center; 
    margin-bottom: 10px; 
    width: 100%;
    max-width: 500px;
  }

  /* 2. Responsive Board using CSS Grid and Viewport Units */
  .board {
    display: grid;
    /* Use fractions (1fr) instead of fixed pixels so it shrinks/grows */
    grid-template-columns: repeat(9, 1fr);
    grid-template-rows: repeat(9, 1fr);
    background: black;
    margin-bottom: 15px;
    width: 100%; /* Take full width */
    max-width: 450px; /* Stop growing on desktop */
    aspect-ratio: 1; /* Force it to remain a perfect square */
    border: 2px solid black;
  }

  .cell {
    width: 100%; 
    height: 100%;
    text-align: center; 
    /* Fluid font size based on container width */
    font-size: clamp(16px, 5vw, 24px); 
    background: white; 
    border: 1px solid #ccc;
    box-sizing: border-box; 
    outline: none;
    padding: 0;
    margin: 0;
    border-radius: 0; /* Fix for iOS rounded corners on inputs */
    -webkit-appearance: none; /* Remove iOS default input styling */
    color: black; /* Prevent iOS showing numbers as blue links */
  }

  /* Thicker borders for 3x3 grids */
  .cell.border-top { border-top: 2px solid black; }
  .cell.border-left { border-left: 2px solid black; }
  /* Only apply bottom/right borders to the very edge if needed, 
     but grid gap or container border usually handles edges better. 
     Keeping your logic but ensuring it doesn't break layout: */
  .cell.border-right { border-right: 2px solid black; }
  .cell.border-bottom { border-bottom: 2px solid black; }

  .cell.fixed { background: #e0e0e0; font-weight: bold; color: #333; }
  .cell.invalid { color: red; background-color: #ffe6e6; }
  .highlighted { background: #dbefff !important; }
  
  button {
    font-size: 1rem;
    padding: 0.6em 1em; /* Larger touch target */
    margin: 5px;
    cursor: pointer;
    border: none;
    background-color: #5282b5;
    color: white;
    border-radius: 4px;
    touch-action: manipulation; /* Improves tap response */
  }

  button:hover { background-color: #355a79; }

  .preset-box {
    border: 2px solid #ccc;
    padding: 10px;
    width: 100%;
    max-width: 500px;
    margin-top: 0.5em;
    box-sizing: border-box;
  }

  /* 3. Wrap presets for small screens */
  .preset-section {
    display: flex; 
    gap: 10px; 
    justify-content: space-around;
    flex-wrap: wrap; 
  }
  
  select {
    padding: 8px; 
    font-size: 16px; /* Prevents iOS zoom on focus */
    width: 100%;
    margin-top: 5px;
  }
  .preset-group { flex: 1; min-width: 80px; text-align: center; }

</style>
</head>

function pad(n) { return n < 10 ? '0'+n : n; }

function startTimer() {
  clearInterval(timerInterval);
  seconds = 0;
  timerEl.textContent = "Time: 00:00"; // Reset visually immediately
  timerInterval = setInterval(() => {
    seconds++;
    timerEl.textContent = `Time: ${pad(Math.floor(seconds/60))}:${pad(seconds%60)}`;
  }, 1000);
}
function stopTimer() { clearInterval(timerInterval); }

function getDifficultyLevel() {
   const val = parseInt(difficultySlider.value);
   if (val <= 40) return "easy";
   else if (val <= 70) return "medium";
   else return "hard";
 }

difficultySlider.addEventListener('input', () => {
  const level = getDifficultyLevel();
  difficultyLabel.textContent = level.charAt(0).toUpperCase() + level.slice(1);
});

function generateFullBoard() {
  const board = Array.from({length:9}, ()=>Array(9).fill(null));
  function isSafe(r,c,num) {
    for(let i=0;i<9;i++){
      if(board[r][i]===num||board[i][c]===num) return false;
    }
    const br=r-r%3, bc=c-c%3;
    for(let rr=br; rr<br+3; rr++){
      for(let cc=bc; cc<bc+3; cc++){
        if(board[rr][cc]===num) return false;
      }
    }
    return true;
  }
  function fill(r=0,c=0) {
    if(r===9) return true;
    const [nr,nc] = c===8 ? [r+1,0] : [r,c+1];
    let nums=[1,2,3,4,5,6,7,8,9].sort(()=>Math.random()-0.5);
    for(let n of nums){
      if(isSafe(r,c,n)){
        board[r][c]=n;
        if(fill(nr,nc)) return true;
        board[r][c]=null;
      }
    }
    return false;
  }
  fill();
  return board;
}

function makePuzzle(fullBoard, emptyCount) {
  let puzzle = JSON.parse(JSON.stringify(fullBoard));
  let removed = 0;
  while(removed < emptyCount) {
    let r=Math.floor(Math.random()*9);
    let c=Math.floor(Math.random()*9);
    if(puzzle[r][c] !== null) {
      puzzle[r][c] = null;
      removed++;
    }
  }
  return puzzle;
}

function populatePresetDropdowns() {
  function fill(sel) {
    sel.innerHTML = '<option value="">--</option>';
    for (let i = 0; i < 10; i++) {
      let opt = document.createElement('option');
      opt.value = i;
      opt.textContent = (i+1).toString();
      sel.appendChild(opt);
    }
  }
  fill(easySelect);
  fill(mediumSelect);
  fill(hardSelect);
}

function selectPreset(level, selElem) {
  const idx = selElem.value;
  if (idx === "") return;
  const { puzzle, solution: sol } = presets[level][idx];
  // Important: Deep copy to prevent mutating the original preset
  window.solution = JSON.parse(JSON.stringify(sol));
  renderBoard(puzzle);
  startTimer();
  messageEl.textContent = '';
  originalPuzzle = JSON.parse(JSON.stringify(puzzle));
  selElem.value = "";
}

function renderBoard(puzzle) {
  boardEl.innerHTML = '';
  userBoard = JSON.parse(JSON.stringify(puzzle));
  for(let r=0;r<9;r++){
    for(let c=0;c<9;c++){
      const cell = document.createElement('input');
      
      // 4. CRITICAL: Use numeric keyboard on Mobile
      cell.setAttribute('type', 'tel'); // Works best on most devices
      cell.setAttribute('inputmode', 'numeric'); // Suggests numeric pad
      cell.setAttribute('pattern', '[0-9]*'); // iOS fallback
      
      cell.maxLength = 1;
      cell.classList.add('cell');
      cell.dataset.row = r;
      cell.dataset.col = c;

      if(r%3===0) cell.classList.add('border-top');
      if(c%3===0) cell.classList.add('border-left');
      if(r===8) cell.classList.add('border-bottom');
      if(c===8) cell.classList.add('border-right');

      cell.addEventListener('focus', (e) => {
        e.target.select(); // Auto-select text on focus for easier overwriting
        highlightRowCol(r,c);
      });

      if(puzzle[r][c] !== null){
        cell.value = puzzle[r][c];
        cell.disabled = true;
        cell.classList.add('fixed');
      } else {
        cell.addEventListener('input', () => {
          let val = parseInt(cell.value);
          if(isNaN(val)||val<1||val>9){
            cell.value=''; userBoard[r][c]=null;
            cell.classList.remove('invalid');
            return;
          }
          userBoard[r][c] = val;
          // Only mark invalid if we actually have a solution loaded
          if(solution && solution.length) {
             cell.classList.toggle('invalid', val !== solution[r][c]);
             checkWin();
          }
        });
      }
      boardEl.appendChild(cell);
    }
  }
}

function highlightRowCol(row,col) {
  document.querySelectorAll('.cell').forEach(c=>c.classList.remove('highlighted'));
  document.querySelectorAll(`.cell[data-row="${row}"]`).forEach(c=>c.classList.add('highlighted'));
  document.querySelectorAll(`.cell[data-col="${col}"]`).forEach(c=>c.classList.add('highlighted'));
}

function resetBoard(){
  if(originalPuzzle.length === 0) return;
  userBoard = JSON.parse(JSON.stringify(originalPuzzle));
  renderBoard(originalPuzzle);
  messageEl.textContent = '';
  startTimer();
}

function newGame(){
  const val = parseInt(difficultySlider.value);
  const emptyCount = val<=40?30:(val<=70?45:55);
  const full = generateFullBoard();
  solution = JSON.parse(JSON.stringify(full));
  const puzzle = makePuzzle(full, emptyCount);
  originalPuzzle = JSON.parse(JSON.stringify(puzzle));
  renderBoard(puzzle);
  messageEl.textContent=''; 
  startTimer();
}

function checkWin(){
  for(let r=0;r<9;r++){
    for(let c=0;c<9;c++){
      if(userBoard[r][c] !== solution[r][c]) return;
    }
  }
  stopTimer(); messageEl.textContent = '🎉 You Win!';
}

// Initialize
populatePresetDropdowns();
difficultySlider.dispatchEvent(new Event('input'));
newGame();

</script>
